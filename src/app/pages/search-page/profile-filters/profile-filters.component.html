<form class="profile-search-form" [formGroup]="searchForm">

      <label class="t-form-label">
        <span class="t-form-label__text">Имя</span>
        <input type="text" class="t-form-input" formControlName="firstName">
      </label>

      <label class="t-form-label">
        <span class="t-form-label__text">Фамилия</span>
        <input type="text" class="t-form-input" formControlName="lastName">
      </label>

      <label class="t-form-label">
        <span class="t-form-label__text">Навыки</span>
        <input type="text" class="t-form-input" formControlName="stack">
      </label>

</form>
