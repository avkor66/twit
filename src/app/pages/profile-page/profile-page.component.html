@if (profile$ | async; as profile) {

  <header class="profile-page__header">

    <app-profile-header
      [profile]="profile"
    >
    </app-profile-header>

    <a class="btn to-settings-btn"
      [routerLink]="['/settings']"
    >
      Редактировать
      <svg icon="settings" class="to-settings-icon"></svg>
    </a>
  </header>

  <main class="profile-page__body">
    <app-post-feed>

    </app-post-feed>
    <div>
      <h3>Подписчики</h3>
      <div class="subscribers-wrapper">

        @for (subscriber of subscribers$ | async; track subscriber.id) {
          <a class="subscribe-avatar-btn" [routerLink]="['/profile', subscriber.id]">
            <img [src]="subscriber.avatarUrl | imgUrl" />
          </a>
        }
          <a class="to-subscribers-search" [routerLink]="['/search']">
          </a>
      </div>

      <h3>Навыки</h3>
      <div class="stack-wrapper">

        @for (skill of profile.stack; track skill) {
          <div class="skill-tags">{{skill}}</div>
        }
      </div>

      <h3>О себе</h3>
      <p class="medium-texp">
        {{ profile.description }}
      </p>

    </div>
  </main>
}
